server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 50
      min-spare: 2

spring:
  application:
    name: faruk-fashion
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/faruk_fashion}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:FarukFashionSecretKey2026VeryLongAndSecureKeyForHS512AlgorithmMustBeAtLeast64BytesLong!!}
  expiration: 86400000
  refresh-expiration: 604800000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:your_razorpay_secret}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  sms-from: ${TWILIO_SMS_FROM:+1234567890}

app:
  name: Faruk Fashion
  support-email: support@farukfashion.com
  support-phone: "+91 93442 82751"
  admin-phone: "+91 93442 82751"
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  seller-email: ${SELLER_EMAIL:orders@farukfashion.com}
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: WARN
    com.farukfashion: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics